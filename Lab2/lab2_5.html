<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
</head>
<body>
    <h1>Форма регистрации пользователя</h1>
    
    <form method="post">
        <table>
            <tr>
                <td><label for="email">E-mail</label></td>
                <td><input type="email" id="email" name="email" placeholder="Введите e-mail" required></td>
            </tr>
            <tr>
                <td><label for="password">Пароль</label></td>
                <td><input type="password" id="password" name="password" placeholder="Введите пароль" required></td>
            </tr>
            <tr>
                <td>Пол</td>
                <td>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Мужчина</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Женщина</label>
                </td>
            </tr>
            <tr>
                <td><label for="birth_year">Год рождения</label></td>
                <td>
                    <select id="birth_year" name="birth_year">
                        <option value="">1981</option>
                    </select>
                    -й
                </td>
            </tr>
            <tr>
                <td>Я знаю</td>
                <td>
                    <input type="checkbox" id="russian" name="languages" value="russian" checked disabled>
                    <label for="russian">Русский</label><br>
                    <input type="checkbox" id="spanish" name="languages" value="spanish">
                    <label for="spanish">Испанский</label><br>
                    <input type="checkbox" id="german" name="languages" value="german">
                    <label for="german">Немецкий</label><br>
                    <input type="checkbox" id="english" name="languages" value="english">
                    <label for="english">Английский</label><br>
                    <input type="checkbox" id="chinese" name="languages" value="chinese">
                    <label for="chinese">Китайский</label>
                </td>
            </tr>
            <tr>
                <td><label for="about">Обо Мне</label></td>
                <td>
                    <textarea id="about" name="about" placeholder="Напишите коротко о себе" rows="4" cols="50"></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <button type="submit">Готово</button>
                    <button type="reset">Очистить</button>
                </td>
            </tr>
        </table>
    </form>

    <script>
        const select = document.getElementById('birth_year');
        for (let year = 2026; year >= 1926; year--) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year;
            if (year === 1981) {
                option.selected = true;
            }
            select.appendChild(option);
        }
    </script>


    <br>
    <br>
    <footer>
        <a href="../index.html">Вернуться на главную</a>
    </footer>
</body>
</html>

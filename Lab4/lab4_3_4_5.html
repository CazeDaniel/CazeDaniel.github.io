<!DOCTYPE html>
<html lang="ru">
<head>
		<meta charset="UTF-8">
		<title>Оформление вертикального меню</title>
		<link rel="stylesheet" href=" https://use.fontawesome.com/releases/v6.4.4/css/all.css">
		<style>
			html {
					background: #f0f0f0;
			}
			
			.menu {
					width: 220px;
					background: #fcfcfc;
					padding: 10px;
			}
			
			.menu ul {
				list-style: none;
				width: 200px;
				
			}
			
			.menu li {
                position: relative;
				
				
                	
			}
			
			.menu li a {
				display: block;
                align-items: center;
                text-decoration: underline;
                color: #369;
			    padding: 8px 12px;
			
			}
			
			.menu li a:hover {
				color: rgb(164, 199, 235);	
			}
			
			.menu li ul {
				width: 150px;
				display: none;
			}

			.menu li:hover > ul {
                display: block;
            }
			
			.menu li li {
			}

			.menu > ul > li::before {
            content: "\f0fe";
            font-family: "FontAwesome";
            position: absolute;
            left: 0;
            top: 9px;
            font-size: 14px;
            color: #000;
            }

			.menu > ul > li:hover::before {
            content: "\f146";
		}

		 .menu li li::before {
            content: "\f192";
            font-family: "FontAwesome";
            position: absolute;
            left: 0;
            top: 11px;
            font-size: 8px;
            color: #000;
            }


	</style>
</head>
<body>
	<nav class="menu">
		<ul>
			<li><a href="#">Фильмы</a>
				<ul>
					<li><a href="#">Экшн</a></li>
					<li><a href="#">Мелодрамы</a></li>
					<li><a href="#">Сериалы</a></li>
					<li><a href="#">Семейные</a></li>
				</ul>
			</li>
			<li><a href="#">Музыка</a>
				<ul>
					<li><a href="#">Классика</a></li>
					<li><a href="#">Джаз</a></li>
					<li><a href="#">Рок</a></li>
					<li><a href="#">Грандж</a></li>
				</ul>
			</li>
			<li><a href="#">Софт</a>
				<ul>
					<li><a href="#">Графика</a></li>
					<li><a href="#">3D-моделирование</a></li>
					<li><a href="#">Машинопись</a></li>
					<li><a href="#">Переводчики</a></li>
				</ul>
			</li>
			<li><a href="#">Игры</a>
				<ul>
					<li><a href="#">РПГ</a></li>
					<li><a href="#">Шутеры</a></li>
					<li><a href="#">Пасьянсы</a></li>
				</ul>
			</li>
		</ul>
	</nav>
</body>
</html>
